name: houseping-app

services:
  app:
    image: houseping:latest
    container_name: houseping-app
    restart: unless-stopped
    network_mode: host
    environment:
      - SPRING_PROFILE=production
      - DB_HOST=localhost
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-houseping}
      - DB_USER=${DB_USER:-houseping}
      - DB_PASSWORD=${DB_PASSWORD:-houseping123}
      - APPLYHOME_API_KEY=${APPLYHOME_API_KEY}
      - LH_API_KEY=${LH_API_KEY}
      - REAL_TRANSACTION_API_KEY=${REAL_TRANSACTION_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_ERROR_WEBHOOK_URL=${SLACK_ERROR_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_IDS=${TELEGRAM_CHAT_IDS:-}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - MASTER_ADMIN_NAVER_ID=${MASTER_ADMIN_NAVER_ID:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - KAKAO_MAP_APP_KEY=${KAKAO_MAP_APP_KEY:-}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY:-}
